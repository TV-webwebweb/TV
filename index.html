<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE TV WEBSITE</title>
  <style>
    :root {
      --ink: #14142b;
      --paper: #fbfbf6;
      --trim: #7f93c4;
      --link: #0b3a8f;
      --link-hover: #1f63d6;
      --shadow: rgba(4, 11, 36, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(#040b24, #0a3f9a);
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: -1;
    }

    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 64px 20px 88px;
      display: grid;
      gap: 30px;
    }

    /* Dialogue box */
    .box {
      position: relative;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 14px;
      padding: 24px 52px 26px 28px;
      box-shadow:
        inset 0 0 0 3px var(--paper),
        inset 0 0 0 6px var(--trim),
        6px 6px 0 var(--shadow);
    }

    .box p { margin: 0; max-width: 60ch; }

    /* "More to read" marker, bottom right */
    .box.text::after {
      content: "";
      position: absolute;
      right: 22px;
      bottom: 18px;
      width: 14px;
      height: 10px;
      background: var(--ink);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .box.text::after { animation: none; }
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    a:hover { color: var(--link-hover); }

    a:focus-visible,
    iframe:focus-visible {
      outline: 3px solid var(--link);
      outline-offset: 3px;
    }

    /* Title: the TV does the talking */
    .hero {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .tv {
      flex: 0 0 auto;
      width: 150px;
      height: auto;
      filter: drop-shadow(5px 5px 0 var(--shadow));
    }

    .box.title {
      flex: 1;
      padding: 30px 32px;
    }

    .box.title::before,
    .box.title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .box.title::before {
      left: -26px;
      transform: translateY(-50%);
      border-width: 16px 26px 16px 0;
      border-color: transparent var(--ink) transparent transparent;
    }

    .box.title::after {
      left: -22px;
      transform: translateY(-50%);
      border-width: 13px 22px 13px 0;
      border-color: transparent var(--paper) transparent transparent;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6.4vw, 3.6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    /* Video frames */
    .box.media {
      padding: 14px;
    }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05101f;
      border: 3px solid var(--ink);
      border-radius: 6px;
      overflow: hidden;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Sound design row: videos left, SoundCloud right */
    .sound-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: stretch;
    }

    .sound-row .videos {
      display: grid;
      gap: 30px;
      align-content: start;
    }

    .box.media.sc {
      display: flex;
      min-height: 420px;
    }

    .box.media.sc iframe {
      flex: 1;
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 6px;
      background: #05101f;
    }

    /* Spotify embed */
    .box.media.sp {
      padding: 14px;
    }

    .sp-frame {
      background: #121212;
      border: 3px solid var(--ink);
      border-radius: 6px;
      overflow: hidden;
      line-height: 0;
    }

    .sp-frame iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
      color-scheme: normal;
    }

    @media (max-width: 640px) {
      body { font-size: 1.125rem; }
      .page { padding: 32px 14px
